<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Partner network">
  <title>Partner network</title>
  <rect width="640" height="360" fill="#eef2f5"/>
  <!-- soft grid -->
  <g stroke="#d5dee7" stroke-width="1">
    <path d="M40 60 H600 M40 120 H600 M40 180 H600 M40 240 H600 M40 300 H600"/>
    <path d="M80 40 V320 M160 40 V320 M240 40 V320 M320 40 V320 M400 40 V320 M480 40 V320 M560 40 V320"/>
  </g>
  <!-- connection lines -->
  <g fill="none" stroke="#13253a" stroke-width="2.5" stroke-linecap="round">
    <path d="M160 220 L320 120 L480 220"/>
    <path d="M160 220 L320 260 L480 220"/>
    <path d="M320 120 L320 260"/>
  </g>
  <!-- cyan accents on links -->
  <g fill="none" stroke="#0e6e8c" stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round" opacity="0.85">
    <path d="M200 200 L280 150"/>
    <path d="M360 150 L440 200"/>
  </g>
  <!-- nodes -->
  <g>
    <circle cx="160" cy="220" r="28" fill="#13253a"/>
    <circle cx="320" cy="120" r="34" fill="#0e6e8c"/>
    <circle cx="480" cy="220" r="28" fill="#13253a"/>
    <circle cx="320" cy="260" r="22" fill="#13253a"/>
    <!-- inner marks -->
    <circle cx="160" cy="220" r="10" fill="#eef2f5"/>
    <circle cx="320" cy="120" r="12" fill="#eef2f5"/>
    <circle cx="480" cy="220" r="10" fill="#eef2f5"/>
    <circle cx="320" cy="260" r="8" fill="#eef2f5"/>
  </g>
  <!-- map pin hint on hub -->
  <path d="M320 96 c-10 0-18 8-18 18 0 14 18 28 18 28s18-14 18-28c0-10-8-18-18-18z" fill="#13253a"/>
  <circle cx="320" cy="114" r="5" fill="#eef2f5"/>
</svg>
