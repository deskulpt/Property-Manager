<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Leasing desk">
  <title>Leasing desk</title>
  <rect width="640" height="360" fill="#eef2f5"/>
  <!-- desk -->
  <path d="M80 250 H560 V270 H80 Z" fill="#13253a"/>
  <path d="M110 270 V310 M530 270 V310" stroke="#13253a" stroke-width="8" stroke-linecap="square"/>
  <!-- monitor -->
  <g fill="none" stroke="#13253a" stroke-width="3">
    <rect x="250" y="110" width="180" height="110" rx="4"/>
    <path d="M320 220 V240 H360 V220"/>
  </g>
  <!-- map on screen -->
  <g fill="none" stroke="#0e6e8c" stroke-width="2" stroke-linecap="round">
    <path d="M280 150 C300 130, 340 170, 360 145 C380 125, 400 160, 410 150"/>
    <circle cx="310" cy="155" r="5" fill="#0e6e8c" stroke="none"/>
    <circle cx="370" cy="148" r="5" fill="#13253a" stroke="none"/>
    <circle cx="400" cy="175" r="5" fill="#0e6e8c" stroke="none"/>
  </g>
  <!-- floorplan sheets -->
  <g transform="translate(120 178)" fill="#f7f9fb" stroke="#13253a" stroke-width="2.5">
    <rect x="10" y="10" width="90" height="62" transform="rotate(-8 55 41)"/>
    <rect x="0" y="18" width="90" height="62"/>
  </g>
  <g transform="translate(120 178)" fill="none" stroke="#0e6e8c" stroke-width="2">
    <path d="M14 34 H70 M14 48 H54 M14 62 H62"/>
  </g>
  <!-- mug -->
  <g transform="translate(470 198)" fill="none" stroke="#13253a" stroke-width="3">
    <path d="M0 20 H36 V52 H0 Z"/>
    <path d="M36 28 H48 C54 28 54 44 48 44 H36"/>
  </g>
  <rect x="6" y="28" width="24" height="8" fill="#0e6e8c" transform="translate(470 198)"/>
</svg>
