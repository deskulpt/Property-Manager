<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Service operations">
  <title>Service operations</title>
  <rect width="640" height="360" fill="#eef2f5"/>
  <!-- warehouse silhouette -->
  <g fill="none" stroke="#13253a" stroke-width="3" stroke-linejoin="round">
    <path d="M72 250 V140 L160 96 L248 140 V250 Z"/>
    <path d="M248 160 H520 V250 H248"/>
    <path d="M248 160 L320 118 H520 L520 160"/>
  </g>
  <!-- bay doors -->
  <g fill="none" stroke="#13253a" stroke-width="2.5">
    <rect x="292" y="178" width="56" height="72"/>
    <rect x="368" y="178" width="56" height="72"/>
    <rect x="444" y="178" width="56" height="72"/>
    <path d="M292 196 H348 M292 214 H348 M292 232 H348"/>
    <path d="M368 196 H424 M368 214 H424 M368 232 H424"/>
    <path d="M444 196 H500 M444 214 H500 M444 232 H500"/>
  </g>
  <!-- clipboard / checklist -->
  <g transform="translate(120 168)">
    <rect x="0" y="0" width="88" height="110" rx="4" fill="#f7f9fb" stroke="#13253a" stroke-width="3"/>
    <rect x="28" y="-10" width="32" height="18" rx="3" fill="#0e6e8c"/>
    <g stroke="#13253a" stroke-width="2.5" stroke-linecap="round">
      <path d="M18 36 H70 M18 54 H70 M18 72 H54"/>
    </g>
    <g fill="none" stroke="#0e6e8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 90 l8 8 16-18"/>
    </g>
  </g>
  <!-- ground line -->
  <line x1="56" y1="250" x2="560" y2="250" stroke="#13253a" stroke-width="3"/>
  <!-- cyan yard mark -->
  <circle cx="540" cy="250" r="10" fill="#0e6e8c"/>
</svg>
