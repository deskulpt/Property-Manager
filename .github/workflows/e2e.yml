name: E2E

on:
  pull_request:
  push:
    branches: [main]

# Sibling CI owns lint/unit/build; this workflow only runs Playwright.
# webServer port: E2E_PORT (default 43124) — see playwright.config.ts.
# Local: `next dev` on that port + throwaway SQLite. CI: `next start` after build.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright full suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build
        env:
          DESKULPT_DIST_DIR: .next
          # Isolated seed DB so parallel prerender workers do not contend with a shared checkout DB.
          DESKULPT_DB_PATH: ${{ runner.temp }}/deskulpt-build.sqlite

      - name: Run e2e
        run: npm run test:e2e
        env:
          CI: "true"
          DESKULPT_DIST_DIR: .next
          # Must match playwright.config.ts default (webServer listens here).
          E2E_PORT: "43124"
          # Optional: unlock password login assertion for sticky admin switcher.
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
